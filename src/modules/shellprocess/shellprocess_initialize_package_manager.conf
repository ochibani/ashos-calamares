#
# Distro-specific package manager initialization
# Arch: pacman keyring + mirrorlist
# Debian: apt configuration
# Fedora: dnf configuration
---

dontChroot: true

script:
  # Arch: initialize pacman keyring and mirrorlist
  - command: 'if [ "$DISTRO" = "arch" ]; then bash /etc/calamares/scripts/update-mirrorlist; fi'
    timeout: 3600
    verbose: true
  - command: 'if [ "$DISTRO" = "arch" ]; then bash /etc/calamares/scripts/create-keyring; fi'
    verbose: true
  - 'if [ "$DISTRO" = "arch" ]; then mkdir -p ${ROOT}/etc/pacman.d/; fi'
  - 'if [ "$DISTRO" = "arch" ]; then cp /etc/pacman.d/mirrorlist ${ROOT}/etc/pacman.d/; fi'
  - 'if [ "$DISTRO" = "arch" ]; then cp -a /etc/pacman.d/gnupg ${ROOT}/etc/pacman.d/; fi'
  # Debian: configure apt sources
  - 'if [ "$DISTRO" = "debian" ]; then mkdir -p ${ROOT}/etc/apt/; fi'
  - 'if [ "$DISTRO" = "debian" ]; then cp /etc/apt/sources.list ${ROOT}/etc/apt/; fi'
  - 'if [ "$DISTRO" = "debian" ]; then cp /etc/resolv.conf ${ROOT}/etc/; fi'
  # Fedora: configure dnf repos
  - 'if [ "$DISTRO" = "fedora" ]; then mkdir -p ${ROOT}/etc/yum.repos.d/; fi'
  - 'if [ "$DISTRO" = "fedora" ]; then cp /etc/yum.repos.d/*.repo ${ROOT}/etc/yum.repos.d/; fi'
  - 'if [ "$DISTRO" = "fedora" ]; then cp /etc/resolv.conf ${ROOT}/etc/; fi'

i18n:
 name: "initialize package manager"
