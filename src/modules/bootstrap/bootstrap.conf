#
### Bootstrap Module
#
# This module bootstraps the base system for Arch, Debian, or Fedora
# depending on the $DISTRO value from the distribution module.
#

---
# Per-distro base packages
basePackages:
    arch:
      - base
      - base-devel
      - btrfs-progs
      - cryptsetup
      - device-mapper
      - dhcpcd
      - diffutils
      - dosfstools
      - e2fsprogs
      - efibootmgr
      - exfatprogs
      - f2fs-tools
      - grub
      - inetutils
      - iptables-nft
      - jfsutils
      - less
      - linux
      - linux-firmware
      - logrotate
      - lsb-release
      - lvm2
      - man-db
      - man-pages
      - mdadm
      - mkinitcpio
      - netctl
      - os-prober
      - perl
      - python
      - s-nail
      - sudo
      - sysfsutils
      - texinfo
      - usbutils
      - which
      - xfsprogs
      - vim
      - paru
    debian:
      - systemd
      - systemd-sysv
      - init
      - linux-image-amd64
      - firmware-linux
      - firmware-iwlwifi
      - firmware-misc-nonfree
      - network-manager
      - sudo
      - vim
      - locales
      - grub-efi-amd64
    fedora:
      - "@core"
      - kernel
      - kernel-modules
      - grub2-efi-ia32
      - shim-x64
      - systemd
      - NetworkManager
      - sudo
      - vim-minimal
      - locale-def

# postInstallFiles is an array of file names which will be copied into the system
# The paths should be relative to the host and the files will be copied to the
# location in the installed system
postInstallFiles:
  arch:
    - "/etc/mkinitcpio.conf"
    - "/etc/calamares/scripts/dmcheck"
    - "/etc/calamares/scripts/ash_fstab"
    - "/etc/calamares/scripts/post_bootstrap"
    - "/etc/calamares/scripts/deploy_base_snapshot"
    - "/etc/calamares/scripts/remove-ucode"
    - "/etc/calamares/scripts/enable-ufw"
    - "/etc/calamares/scripts/shell-setup"
  debian:
    - "/etc/calamares/scripts/shell-setup"
  fedora:
    - "/etc/calamares/scripts/shell-setup"
