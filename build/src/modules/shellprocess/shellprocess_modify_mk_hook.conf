#
# Distro-specific init system hooks setup
# Arch: mkinitcpio hooks
# Debian: initramfs-tools
# Fedora: dracut
---

dontChroot: true

script:
  # Arch: modify mkinitcpio hook
  - 'if [ "$DISTRO" = "arch" ]; then mkdir -p /etc/pacman.d/hooks/; fi'
  - 'if [ "$DISTRO" = "arch" ]; then cp /etc/calamares/scripts/90-mkinitcpio-install.hook /etc/pacman.d/hooks/; fi'
  - 'if [ "$DISTRO" = "arch" ]; then mkdir -p ${ROOT}/usr/share/libalpm/scripts/; fi'
  - 'if [ "$DISTRO" = "arch" ]; then cp /etc/calamares/scripts/mkinitcpio-install-calamares ${ROOT}/usr/share/libalpm/scripts/; fi'
  - 'if [ "$DISTRO" = "arch" ]; then chmod +x ${ROOT}/usr/share/libalpm/scripts/mkinitcpio-install-calamares; fi'
  - 'if [ "$DISTRO" = "arch" ]; then mkdir -p ${ROOT}/etc/pacman.d/hooks/; fi'
  - 'if [ "$DISTRO" = "arch" ]; then cp /etc/calamares/scripts/90-mkinitcpio-install.hook ${ROOT}/etc/pacman.d/hooks/; fi'
  # Debian: configure initramfs-tools
  - 'if [ "$DISTRO" = "debian" ]; then chroot ${ROOT} dpkg-reconfigure -f noninteractive initramfs-tools; fi'
  # Fedora: configure dracut
  - 'if [ "$DISTRO" = "fedora" ]; then chroot ${ROOT} dracut --force --regenerate-all; fi'

i18n:
 name: "configure initramfs hooks (distro-specific)"
